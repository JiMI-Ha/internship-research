name: Topic 论文筛选
description: 输入一个研究 Topic，生成论文搜索、总结、指标建议与可解释排名
title: "[Topic Filter] "
labels: [topic-filter]
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: 你想调研和筛选什么问题？
      placeholder: 多教师 OPD 中如何筛选高价值训练数据？
    validations:
      required: true
  - type: textarea
    id: business_goal
    attributes:
      label: 业务目标（可选）
      description: 希望结果帮助什么决策？不填时，筛选器会根据 Topic 给出默认假设。
      placeholder: 在固定教师服务预算下，提高能力整合效果，同时避免代码和 agent 能力明显退化。
  - type: textarea
    id: constraints
    attributes:
      label: 约束或关注点（可选）
      description: 例如预算、模型规模、数据可得性、部署限制、必须保留的能力或不希望看到的论文类型。
      placeholder: 没有可靠 final-answer verifier；优先关注长轨迹和多教师设置。
  - type: dropdown
    id: publish
    attributes:
      label: 完成后是否发布到网站？
      description: 选择“只回复 Issue”可先审阅结果；选择“发布”会要求 Agent 创建 Topic 页面并提交 PR。
      options:
        - 只回复 Issue，暂不发布
        - 发布到网站并创建 PR
      default: 0
    validations:
      required: true
